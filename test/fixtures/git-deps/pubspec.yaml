name: git_deps_package
description: Package with git dependencies for testing
version: 1.0.0

environment:
  sdk: ^3.0.0

dependencies:
  # Simple git URL
  simple_git_dep:
    git: https://github.com/example/simple_repo.git

  # Git with ref
  git_with_ref:
    git:
      url: https://github.com/example/another_repo.git
      ref: develop

  # Path dependency
  local_package:
    path: ../local_package

  # Regular pub.dev dependency
  http: ^1.1.0

dev_dependencies:
  test: ^1.24.0
