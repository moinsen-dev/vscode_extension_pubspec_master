name: app_b
description: Second application with conflicting dependency versions.
version: 1.0.0

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.24.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Version conflict: app_b uses http ^1.2.0 (differs from app_a's ^1.0.0)
  http: ^1.2.0
  # Version conflict: app_b uses provider ^6.1.0 (differs from app_a's ^6.0.0)
  provider: ^6.1.0
  # Same version as app_a (no conflict)
  collection: ^1.18.0
  shared_lib:
    path: ../shared_lib
  data_layer:
    path: ../data_layer
