name: shop_app
description: Shop application - Flutter app for e-commerce.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.24.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../packages/core
  ui_kit:
    path: ../../packages/ui_kit
  shared_models:
    path: ../../packages/shared_models

  # INTENTIONAL CONFLICT: http ^1.0.0 (admin_app uses ^1.2.0)
  http: ^1.0.0

  # Provider for state management
  provider: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
